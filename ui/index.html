<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRust Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div>
                <h1>CRust Studio</h1>
                <p>디자이너 · 개발자를 위한 CRust 로컬 런처 &amp; 테마 스튜디오</p>
            </div>
        </div>
        <div class="status-pill" id="status-pill">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">대기 중</span>
        </div>
    </header>

    <main class="grid">
        <!-- Left Column: Server & Workspace -->
        <section class="card">
            <div class="card-head">
                <h2>로컬 서버 제어</h2>
                <label class="toggle">
                    <input type="checkbox" id="dev-mode-toggle">
                    <span>실시간 템플릿 반영 (dev_mode)</span>
                </label>
            </div>

            <div class="workspace-box">
                <label for="ws-path">CRust 작업 폴더</label>
                <div class="input-row">
                    <input type="text" id="ws-path" placeholder="예: C:\CRust 또는 기존 rust_board 폴더">
                    <button class="btn" id="btn-save-ws">적용</button>
                    <button class="btn btn-accent" id="btn-install-crust">🚀 새로 설치</button>
                    <button class="btn" id="btn-open-ws">폴더 열기</button>
                </div>
                <small id="ws-hint" class="hint"></small>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" id="btn-start">▶ 서버 시작 &amp; 브라우저 열기</button>
                <button class="btn btn-danger" id="btn-stop" disabled>■ 서버 중지</button>
            </div>

            <div class="quick-links">
                <button class="btn btn-ghost" id="btn-open-home" disabled>🌐 사이트 열기</button>
                <button class="btn btn-ghost" id="btn-open-admin" disabled>⚙️ 관리자 (/admin)</button>
                <button class="btn btn-ghost" id="btn-open-themes-page" disabled>🎨 테마 관리</button>
            </div>

            <div class="log-box">
                <div class="log-head">
                    <span>실시간 서버 로그</span>
                    <span class="muted" id="server-url">http://127.0.0.1:3000</span>
                </div>
                <pre id="log-output">CRust Studio가 준비되었습니다.</pre>
            </div>
        </section>

        <!-- Right Column: Theme Studio -->
        <section class="card">
            <div class="card-head">
                <h2>테마 스튜디오</h2>
                <button class="btn btn-sm" id="btn-open-themes-dir">📁 themes 폴더 열기</button>
            </div>

            <div class="new-theme-box">
                <h3>새 테마 만들기</h3>
                <div class="form-grid">
                    <input type="text" id="new-slug" placeholder="테마 ID (예: my-modern-theme)">
                    <input type="text" id="new-name" placeholder="테마 이름 (예: 모던 스튜디오)">
                    <input type="text" id="new-author" placeholder="제작자명">
                    <button class="btn btn-accent" id="btn-create-theme">+ 기본 테마 복제 생성</button>
                </div>
            </div>

            <div class="theme-list-head">
                <h3>설치된 테마 목록</h3>
                <span class="muted" id="theme-count">0개</span>
            </div>
            <div class="theme-list" id="theme-list"></div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
